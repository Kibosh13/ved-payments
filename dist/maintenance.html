<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Сайт временно недоступен</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07110f;
      color: #f4fff9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(56, 255, 171, 0.16), transparent 34%),
        radial-gradient(circle at 80% 80%, rgba(47, 143, 255, 0.11), transparent 30%),
        #07110f;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
    }

    main {
      position: relative;
      width: min(100%, 680px);
      padding: clamp(36px, 7vw, 72px);
      text-align: center;
      border: 1px solid rgba(137, 255, 204, 0.18);
      border-radius: 28px;
      background: rgba(9, 27, 22, 0.74);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 8px 14px;
      border: 1px solid rgba(80, 255, 179, 0.22);
      border-radius: 999px;
      color: #9dffd4;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #44f0a1;
      box-shadow: 0 0 18px #44f0a1;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 68px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    p {
      max-width: 500px;
      margin: 24px auto 0;
      color: rgba(229, 255, 242, .68);
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.6;
    }

    small {
      display: block;
      margin-top: 32px;
      color: rgba(229, 255, 242, .4);
    }
  </style>
</head>
<body>
  <main>
    <div class="status">Технические работы</div>
    <h1>Сайт временно недоступен</h1>
    <p>Мы проводим технические работы. Пожалуйста, вернитесь позже.</p>
    <small>Код ответа сервера: 503</small>
  </main>
</body>
</html>
